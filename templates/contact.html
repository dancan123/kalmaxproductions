<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Kalmax Productions</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        .contact-container { max-width: 700px; margin: 0 auto;}
        form { display: flex; flex-direction: column; gap: 2rem; background: var(--secondary-bg); padding: 4rem; border: 1px solid var(--border-color); border-radius: 8px;}
        .form-group { display: flex; flex-direction: column; gap: 0.5rem; }
        label { text-transform: uppercase; font-size: 0.8rem; letter-spacing: 2px; color: var(--accent-color); }
        input, textarea { background: #000; border: 1px solid var(--border-color); padding: 1.2rem; color: #fff; font-size: 1rem; border-radius: 4px; border-inline-start: 1px solid var(--border-color);}
        input:focus, textarea:focus { border-color: var(--accent-color); outline: none; }
    </style>
</head>
<body>
    <nav>
        <div class="logo">KALMAX PRODUCTIONS</div>
        <ul class="nav-links">
            <li><a href="/">Home</a></li>
            <li><a href="/portfolio">Portfolio</a></li>
            <li><a href="/services">Services</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
    </nav>

    <main class="section-padding" style="padding-top: 12rem;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Get In Touch</h2>
        <p style="text-align: center; margin-bottom: 4rem; opacity: 0.7;">Ready to capture your story? Send us a message and we'll respond within 24 hours.</p>
        <div class="contact-container">
            <form id="contact-form">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="john@example.com" required>
                </div>
                <div class="form-group">
                    <label>Inquiry Type</label>
                    <input type="text" placeholder="Wedding, Portrait, Commercial..." required>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea rows="6" placeholder="Tell us about your project..."></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 2rem;">Send Message</button>
            </form>
        </div>
    </main>

    <footer style="padding: 4rem 5%; background: var(--secondary-bg); text-align: center; border-top: 1px solid var(--border-color);">
        <p>&copy; 2026 Kalmax Productions. All rights reserved.</p>
        <div style="margin-top: 1.5rem; font-size: 0.8rem; opacity: 0.7; letter-spacing: 1.5px; text-transform: uppercase;">
            Crafted by <a href="https://angaza-computes-co-ltd.vercel.app/" target="_blank" style="color: var(--accent-color); font-weight: 700;">Angaza Computecs</a> 
            <span style="margin: 0 10px; opacity: 0.3;">|</span>
            <a href="https://dancan-blog.vercel.app/" target="_blank" style="color: var(--accent-color);">Developer Blog</a>
        </div>
    </footer>

    <script src="{{ url_for('static', path='/js/main.js') }}"></script>
</body>
</html>
